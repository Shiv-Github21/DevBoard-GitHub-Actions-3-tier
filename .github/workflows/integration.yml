name: continous-integration
on:
  workflow_dispatch: 

jobs:
  fe-lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
         node-version: '20' # Specify your required Node version
         cache: 'npm'
         cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci 
      - name: Run Tests
        run: npm test
      - name: Run Linter Validation
        run: npm run lint

      - name: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: /frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-fe-naya:latest

  be-lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses:  actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' 
          cache-dependency-path: 'go.sum'
          cache: true   
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
      - name: Go-Linter
        run: go vet
      - name: Run Test Cases
        run: go test ./...
      - name: setup docker
        uses: docker/setup-buildx-action@v2
      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker Image for be
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/backend:latest
          
  
        



        
